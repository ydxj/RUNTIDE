name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (needed for go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l cmd internal build main.go)" || (gofmt -l cmd internal build main.go; exit 1)
      - name: go vet
        run: go vet ./cmd/... ./internal/... ./tests/e2ehost/... ./build/... .
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: ./cmd/... ./internal/... ./tests/e2ehost/... ./build/... .
      - name: go test
        run: go test ./cmd/... ./internal/... -count=1 -timeout 10m
      - name: Build CLI
        run: go build -ldflags "-s -w" -o dist/runtide.exe ./cmd/runtide

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
